<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark Rates</title>
<style>
:root {
  color-scheme: light;
  --page:           #f9f9f7;
  --surface-1:      #fcfcfb;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --grid:           #e1e0d9;
  --axis:           #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  --up:             #006300;
  --down:           #d03b3b;
  --series-1:       #2a78d6;
  --series-2:       #eb6834;
  --series-3:       #1baf7a;
  --series-4:       #eda100;
  --series-5:       #e87ba4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --border:         rgba(255,255,255,0.10);
    --up:             #0ca30c;
    --down:           #d03b3b;
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --series-4:       #c98500;
    --series-5:       #d55181;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:           #0d0d0d;
  --surface-1:      #1a1a19;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --grid:           #2c2c2a;
  --axis:           #383835;
  --border:         rgba(255,255,255,0.10);
  --up:             #0ca30c;
  --down:           #d03b3b;
  --series-1:       #3987e5;
  --series-2:       #d95926;
  --series-3:       #199e70;
  --series-4:       #c98500;
  --series-5:       #d55181;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }

header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 20px; }
.spacer { flex: 1; }

button, select {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 7px; padding: 6px 11px; cursor: pointer;
}
button:hover, select:hover { border-color: var(--axis); }
button:disabled { opacity: 0.5; cursor: default; }
button.primary { background: var(--series-1); color: #fff; border-color: transparent; font-weight: 550; }

/* ---- market columns ---- */
/* One column per market, left to right. A market carrying several benchmarks
   (Malaysia has five against one each side) takes two grid slots and flows its
   cards two-abreast, so the row stays roughly level instead of one column
   running two screens while the others end after 600px. The span comes from
   db.market_layout() so the hosted dashboard groups them identically. */
/* Stacked by default. `dense` matters: the wide market takes a whole row, and
   without it the narrow markets after it would leave a hole in the row above. */
.markets { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px;
           margin-bottom: 28px; align-items: start; grid-auto-flow: row dense; }
.market { min-width: 0; }
.market.wide { grid-column: 1 / -1; }
.mkt-head { display: flex; align-items: center; gap: 9px; margin: 0 0 12px;
            padding-bottom: 9px; border-bottom: 1px solid var(--grid); }
.mkt-head .flag { display: inline-flex; line-height: 0; border-radius: 3px;
                  overflow: hidden; box-shadow: 0 0 0 1px var(--border); flex: none; }
.mkt-head .name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
.mkt-head .count { font-size: 11px; color: var(--text-muted); margin-left: auto; }

/* Money market vs government. Only drawn where a market actually holds both,
   so a single-benchmark column never carries a redundant heading. */
.grp + .grp { margin-top: 18px; }
.grp-head { font-size: 10px; font-weight: 650; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--text-muted); margin: 0 0 9px; }
/* Cards fill whatever width the column was given, never going below the ~300px
   three headline figures need to sit on one line. min() keeps a single-card
   column from overflowing when the column itself is narrower than that. */
.grp-cards { display: grid; gap: 14px; align-items: start;
             grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); }
/* auto-fill rather than auto-fit: the government group holds two cards where
   the money market group holds three, and auto-fit would stretch those two
   to half the row each so the same card read at two different sizes. */

/* Three single-benchmark markets share a row; the wide one gets its own and
   flows three cards across.

   Keeping all four markets in one row was tried and measured worse. It leaves
   the wide market only about 630px, so its cards fall to ~305px, the three
   headline figures wrap onto two lines, and the section grows to 977px against
   819px for this arrangement. Height is the thing being fixed here, so the row
   loses. */
/* Breakpoints follow the card, not round numbers. A card needs ~330px to keep
   its three headline figures on one line, so three across needs 3*330 + 2*20 of
   content, and two across needs 2*330 + 20. Below that they stack. */
@media (min-width: 760px) {
  .markets { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 1120px) {
  .markets { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* ---- curve cards ---- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 28px; }
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px 6px; overflow: hidden;
}
.card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; align-self: center; }
.card h2 { font-size: 15px; font-weight: 600; margin: 0; }
.card .meta { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; }
/* One block per headline tenor. A market often quotes several together, so
   they sit in a row and wrap when the column is narrow. */
.heroes { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 12px; }
.hero { display: flex; flex-direction: column; gap: 1px; }
.hero .val { font-size: 26px; font-weight: 620; letter-spacing: -0.02em; line-height: 1.1; }
.hero .lbl { font-size: 11px; color: var(--text-secondary); font-weight: 600; }
.hero .chg { font-size: 11px; font-variant-numeric: tabular-nums; }
.heroes .asof { width: 100%; margin: 2px 0 0; font-size: 12px; color: var(--text-muted); }
/* Four figures will not sit on one line in a single-benchmark column, and a
   3-then-1 wrap reads as an accident. Two by two is deliberate and keeps the
   type size, which matters more than fitting one row. */
.heroes[data-n="4"] { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                      gap: 12px 18px; }
.heroes[data-n="4"] .asof { grid-column: 1 / -1; }
/* A value carried from an earlier date than the card's heading. Always shown
   with that date, so the card cannot imply it is today's fixing. */
.held { color: var(--text-muted); }
.tnote { color: var(--text-muted); font-size: 11px; margin-left: 5px;
         font-variant-numeric: tabular-nums; }

/* The full tenor table repeats the headline figures for most curves now that
   each card shows three, so it collapses by default and the card keeps only
   what the headlines do not already say. */
.more { margin: 0 0 8px; }
.more > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center;
                  gap: 5px; font-size: 11px; color: var(--text-secondary);
                  border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary::after { content: "be"; font-size: 9px; transition: transform .12s; }
.more[open] > summary::after { transform: rotate(180deg); }
.more > summary:hover { color: var(--text-primary); border-color: var(--axis); }
.more .extra { font-variant-numeric: tabular-nums; }
.more table { margin-top: 8px; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 5px 0; font-size: 13px; }
th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase;
     letter-spacing: 0.04em; border-bottom: 1px solid var(--grid); padding-bottom: 6px; }
th:first-child, td:first-child { text-align: left; }
tbody tr + tr td { border-top: 1px solid var(--grid); }
/* A rising benchmark raises borrowing cost, so a rise reads red and a fall
   green. The hosted Streamlit dashboard uses the same convention. */
.chg-rise { color: var(--down); }
.chg-fall { color: var(--up); }
.chg-flat { color: var(--text-muted); }

.pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
        color: var(--text-secondary); white-space: nowrap; }
.pill.stale { color: var(--down); border-color: var(--down); font-weight: 550; }

/* ---- panels ---- */
.panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
         padding: 18px 20px 14px; margin-bottom: 20px; }
.panel h3 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.panel .hint { font-size: 12px; color: var(--text-muted); margin: 0 0 16px; }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 10px; font-size: 13px; background: transparent; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--grid); font-weight: 600; }
.tenors { display: flex; gap: 6px; flex-wrap: wrap; }
.tchip { border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; font-size: 12px;
         background: transparent; display: inline-flex; align-items: center; gap: 6px; }
.tchip[aria-pressed="true"] { border-color: currentColor; font-weight: 600; }
.tchip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: none; }
.tchip[aria-pressed="true"] .dot { display: block; }
.tchip.dead { color: var(--text-muted); border-style: dashed; }
/* Series from other markets, laid over the same axis so the gap between, say,
   USD SOFR and PHP BVAL is readable without flipping between two charts. */
.compare { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 10px; }
.compare label { font-size: 12px; color: var(--text-secondary); }
.compare select { font-size: 12px; padding: 4px 8px; border-radius: 7px;
                  border: 1px solid var(--border); background: transparent;
                  color: inherit; max-width: 220px; }
.tchip .x { margin-left: 2px; opacity: .55; font-weight: 600; }
.tchip .x:hover { opacity: 1; }

svg { display: block; width: 100%; height: auto; overflow: visible; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.axisline { stroke: var(--axis); stroke-width: 1; }
.tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.endlabel { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }

.tip { position: fixed; pointer-events: none; z-index: 40; background: var(--surface-1);
       border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
       box-shadow: 0 6px 20px rgba(0,0,0,0.13); opacity: 0; transition: opacity .1s; }
.tip.on { opacity: 1; }
.tip .d { color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
.tip .r { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tip .r b { margin-left: auto; font-variant-numeric: tabular-nums; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12px;
          color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 3px; border-radius: 2px; }

.note { font-size: 12px; color: var(--text-muted); margin-top: 14px; padding-top: 12px;
        border-top: 1px solid var(--grid); }
.empty { color: var(--text-muted); padding: 28px 0; text-align: center; font-size: 13px; }

.alert { background: var(--surface-1); border: 1px solid var(--down); border-left-width: 4px;
         border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; }
.alert h4 { margin: 0 0 4px; font-size: 13px; font-weight: 650; color: var(--down);
            display: flex; align-items: center; gap: 7px; }
.alert p { margin: 0 0 6px; color: var(--text-secondary); }
.alert code { background: var(--grid); padding: 2px 6px; border-radius: 4px;
              font-size: 12px; color: var(--text-primary); }
.dataview { max-height: 320px; overflow: auto; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Benchmark Rates</h1>
  <span class="spacer"></span>
  <button id="theme" title="Toggle light / dark">Theme</button>
  <button id="refresh" class="primary">Refresh now</button>
</header>
<p class="sub" id="subtitle">Loading&hellip;</p>

<div id="alerts"></div>

<div class="cards" id="cards"></div>

<section class="panel">
  <h3>History</h3>
  <p class="hint">Rate history by tenor. Hover the chart for values on a given date.</p>
  <div class="controls">
    <div class="seg" id="curvePick"></div>
    <div class="seg" id="rangePick"></div>
    <span class="spacer"></span>
    <button id="tableToggle" aria-pressed="false">Table view</button>
    <button id="exportBtn">Export CSV</button>
  </div>
  <div class="tenors" id="tenorPick"></div>
  <div class="compare">
    <label for="comparePick">Compare with</label>
    <select id="comparePick"></select>
    <div class="tenors" id="compareChips"></div>
  </div>
  <div id="chart"></div>
  <div class="legend" id="legend"></div>
  <div class="dataview" id="dataview" hidden></div>
  <p class="note" id="srcNote"></p>
</section>

<section class="panel">
  <h3>Term structure</h3>
  <p class="hint">Latest published curve against an earlier date, to show how the shape has moved.</p>
  <div class="controls">
    <div class="seg" id="shapeRange"></div>
  </div>
  <div id="shape"></div>
  <div class="legend" id="shapeLegend"></div>
</section>

<p class="note" id="footer"></p>
</div>

<div class="tip" id="tip"></div>

<script>
"use strict";

const SERIES = ["--series-1","--series-2","--series-3","--series-4","--series-5"];
const MAX_SERIES = SERIES.length;
const RANGES = [["1M",30],["3M",91],["6M",182],["1Y",365],["3Y",1095],["5Y",1825],["Max",null]];

const state = {
  meta: [], markets: [], curve: null, tenors: [], compare: [], range: 365,
  slots: {},            // series key -> palette slot; survivors keep their colour
  data: null, series: [], shape: null, shapeBack: 90, tableView: false,
};

/* A line is identified by curve and tenor together. "3M" alone stopped being
   unambiguous once KLIBOR, MYOR, THOR and SOFR could share one chart. */
const seriesKey = (curve, tenor) => `${curve}|${tenor}`;

/* Everything currently plotted: the chosen market's tenors, plus any series
   pulled in from other markets. */
function activeSeries() {
  const m = curveMeta();
  const own = m ? state.tenors.map(t => ({
    key: seriesKey(m.curve, t), curve: m.curve, tenor: t, label: `${m.label} ${t}`,
  })) : [];
  const overlay = state.compare.map(key => {
    const [curve, tenor] = key.split("|");
    const cm = state.meta.find(x => x.curve === curve);
    return { key, curve, tenor, label: `${cm ? cm.label : curve} ${tenor}` };
  });
  // Trim the tenor list, not the comparisons. The tenors are usually just the
  // defaults this market loaded with, whereas a comparison was picked on
  // purpose, so cutting the combined tail would drop the very series the
  // reader came for.
  const kept = overlay.slice(0, MAX_SERIES);
  return own.slice(0, Math.max(0, MAX_SERIES - kept.length)).concat(kept);
}

const $ = (id) => document.getElementById(id);
const fmt = (v, d = 3) => v === null || v === undefined ? "–" : v.toFixed(d);
const iso = (d) => d.toISOString().slice(0, 10);

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function niceDate(s) {
  const [y, m, d] = s.split("-");
  return `${+d} ${MONTHS[+m-1]} ${y}`;
}
// Day and month only. Used where a date sits beside a figure and the year
// would crowd it out without telling the reader anything.
function shortDate(s) {
  const [, m, d] = s.split("-");
  return `${+d} ${MONTHS[+m-1]}`;
}
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url} -> ${r.status}`);
  return r.json();
}

/* Assign a stable palette slot. Deselecting a tenor frees its slot but never
   repaints the tenors that remain on screen. */
function slotFor(key) {
  if (state.slots[key] !== undefined) return state.slots[key];
  const taken = new Set(activeSeries().map(s => state.slots[s.key]).filter(v => v !== undefined));
  for (let i = 0; i < MAX_SERIES; i++) {
    if (!taken.has(i)) { state.slots[key] = i; return i; }
  }
  state.slots[key] = 0;
  return 0;
}
const colorOf = (key) => `var(${SERIES[slotFor(key)]})`;

/* ---------------- alerts ---------------- */

/* Only a genuine failure raises a banner. A quiet weekend or a public holiday
   logs "no publication", which is normal and stays silent. */
function renderAlerts() {
  const broken = state.meta.filter(m => m.failing || m.stale);
  if (!broken.length) { $("alerts").innerHTML = ""; return; }

  $("alerts").innerHTML = broken.map(m => {
    const why = m.failing
      ? `The daily job has failed ${m.fail_count} time${m.fail_count > 1 ? "s" : ""} in a row.`
      : `No data for ${m.missed_weekdays} weekdays, past the tolerance of ${m.missed_tolerance}.`;
    const detail = m.last_error
      ? `<p><strong>Last error:</strong> ${escapeHtml(m.last_error)}</p>` : "";
    return `<div class="alert">
      <h4>&#9888; ${m.label} is not updating</h4>
      <p>${why} Stored data is unaffected - the last good values are still shown below.</p>
      ${detail}
      <p>Diagnose it with <code>python cli.py doctor --curve ${m.curve}</code></p>
    </div>`;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ---------------- cards ---------------- */

/* One column per market, left to right, each holding that market's cards.
   Cards are appended before loadCardTable runs, because the no-data branch
   writes into the card synchronously and would not find it otherwise. */
function renderCards() {
  const host = $("cards");
  host.innerHTML = "";
  host.className = "markets";

  const byCurve = {};
  state.meta.forEach((m, i) => { byCurve[m.curve] = m; m._slot = i; });

  const all = state.meta.map(m => m.curve);
  const markets = (state.markets && state.markets.length)
    ? state.markets
    : [{ market: "", flag: "", curves: all, span: 1, columns: 1,
         groups: [{ group: null, curves: all }] }];

  const pending = [];
  markets.forEach(mkt => {
    const col = document.createElement("div");
    // A market with several benchmarks spans two grid slots and flows its
    // cards two-abreast, so no single column runs away with the page height.
    col.className = "market" + ((mkt.span || 1) > 1 ? " wide" : "");
    if (mkt.market) {
      col.innerHTML =
        `<div class="mkt-head"><span class="flag">${mkt.flag}</span>
           <span class="name">${mkt.market}</span>
           <span class="count">${mkt.curves.length} benchmark${
             mkt.curves.length === 1 ? "" : "s"}</span></div>`;
    }
    host.appendChild(col);

    const groups = mkt.groups && mkt.groups.length
      ? mkt.groups : [{ group: null, curves: mkt.curves }];
    groups.forEach(g => {
      const block = document.createElement("div");
      block.className = "grp";
      // group is null where the market sits entirely in one group, and a
      // heading with nothing to contrast against would only add clutter.
      if (g.group) block.innerHTML = `<p class="grp-head">${g.group}</p>`;
      // How many cards fit across is left to the CSS, which auto-fills on the
      // column's actual width. mkt.columns is what the hosted dashboard uses,
      // where columns cannot reflow.
      const grid = document.createElement("div");
      grid.className = "grp-cards";
      block.appendChild(grid);
      col.appendChild(block);

      g.curves.forEach(curve => {
        const m = byCurve[curve];
        if (!m) return;
        grid.appendChild(buildCard(m, m._slot));
        pending.push(m);
      });
    });
  });

  pending.forEach(loadCardTable);
}

function buildCard(m, i) {
  const card = document.createElement("div");
  card.className = "card";
  const stale = (m.stale || m.failing)
    ? `<span class="pill stale">${m.failing ? "not updating" : m.age_days + "d old"}</span>`
    : `<span class="pill">${m.age_days === null ? "no data" : m.age_days + "d ago"}</span>`;
  card.innerHTML = `
    <div class="card-head">
      <span class="swatch" style="background:var(${SERIES[i % MAX_SERIES]})"></span>
      <h2>${m.label}</h2><span class="spacer"></span>${stale}
    </div>
    <p class="meta">${m.rows.toLocaleString()} observations
       &middot; from ${m.first_date ? niceDate(m.first_date) : "–"}</p>
    <div class="heroes" id="heroes-${m.curve}"></div>
    <div id="tbl-${m.curve}"></div>`;
  return card;
}

async function loadCardTable(m) {
  if (!m.rows) { $("tbl-" + m.curve).innerHTML = `<p class="empty">No data yet.</p>`; return; }
  const d = await getJSON(`/api/latest?curve=${m.curve}`);
  // Which tenors headline the card is declared per curve in db.CURVES and
  // resolved by the API, so both dashboards agree. Usually one, but PHP BVAL
  // shows 3Y, 5Y and 7Y side by side.
  const byTenor = Object.fromEntries(d.rows.map(r => [r.tenor, r]));
  const heads = (d.headlines || []).map(t => byTenor[t]).filter(Boolean);
  if (!heads.length && d.rows.length) heads.push(d.rows[0]);

  const box = $("heroes-" + m.curve);
  // Drives the two-by-two layout at four figures; see .heroes[data-n] in the CSS.
  box.dataset.n = heads.length;
  box.innerHTML = heads.map(h => {
    const c = h.change_bp;
    const cls = c === null ? "chg-flat" : c > 0 ? "chg-rise" : c < 0 ? "chg-fall" : "chg-flat";
    const txt = c === null ? "" : `${c > 0 ? "+" : ""}${c.toFixed(1)} bp`;
    // as_of is set only when the source had not yet published this tenor for
    // the card's date, so the figure is the last one it did publish. Naming
    // that date is the whole point: an unlabelled stale rate is worse than no
    // rate at all on a card people price off.
    const held = h.as_of ? `<span class="held">${txt ? " &middot; " : ""}as of ${shortDate(h.as_of)}</span>` : "";
    return `<div class="hero">
              <span class="val">${fmt(h.rate)}%</span>
              <span class="lbl">${h.tenor}</span>
              <span class="chg ${cls}">${txt}${held}</span>
            </div>`;
  }).join("") + `<p class="asof">${niceDate(d.date)}</p>`;

  // The headline figures now cover three tenors, so for several curves the
  // table below repeated them exactly and bought nothing but height. Show it
  // only where the source publishes tenors the headlines leave out, and keep
  // it collapsed until asked for.
  const extras = d.rows.filter(r => !heads.some(h => h.tenor === r.tenor));
  if (!extras.length) { $("tbl-" + m.curve).innerHTML = ""; return; }

  const body = d.rows.map(r => {
    const c = r.change_bp;
    const cls = c === null ? "chg-flat" : c > 0 ? "chg-rise" : c < 0 ? "chg-fall" : "chg-flat";
    const txt = c === null ? "–" : (c > 0 ? "+" : "") + c.toFixed(1);
    const note = r.as_of ? `<span class="tnote">${shortDate(r.as_of)}</span>` : "";
    return `<tr><td>${r.tenor}${note}</td><td>${fmt(r.rate)}</td>
            <td class="${cls}">${txt}</td></tr>`;
  }).join("");
  $("tbl-" + m.curve).innerHTML =
    `<details class="more">
       <summary>All ${d.rows.length} tenors</summary>
       <table><thead><tr><th>Tenor</th><th>Rate&nbsp;%</th><th>Chg&nbsp;bp</th></tr></thead>
       <tbody>${body}</tbody></table>
     </details>`;
}

/* ---------------- controls ---------------- */

function renderControls() {
  $("curvePick").innerHTML = state.meta.map(m =>
    `<button data-curve="${m.curve}" aria-pressed="${m.curve === state.curve}">${m.label}</button>`).join("");
  $("curvePick").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.curve = b.dataset.curve;
    state.slots = {};
    state.tenors = defaultTenors();
    // A comparison against the market you just switched to would double the
    // same line, so those entries are dropped rather than left duplicating.
    state.compare = state.compare.filter(k => !k.startsWith(state.curve + "|"));
    renderControls(); loadSeries(); loadShape();
  };

  $("rangePick").innerHTML = RANGES.map(([lbl, days]) =>
    `<button data-days="${days === null ? "" : days}" aria-pressed="${state.range === days}">${lbl}</button>`).join("");
  $("rangePick").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.range = b.dataset.days === "" ? null : +b.dataset.days;
    renderControls(); loadSeries();
  };

  const m = curveMeta();
  const live = new Set((m && m.active_tenors) || []);
  $("tenorPick").innerHTML = (m ? m.tenors : []).map(t => {
    const on = state.tenors.includes(t);
    const style = on ? `style="color:${colorOf(seriesKey(m.curve, t))}"` : "";
    const dead = !live.has(t);
    return `<button class="tchip${dead ? " dead" : ""}" data-tenor="${t}" aria-pressed="${on}" ${style}
              ${dead ? 'title="No longer published - historical data only"' : ""}>
              <span class="dot"></span>${t}${dead ? " · past" : ""}</button>`;
  }).join("");
  $("tenorPick").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const t = b.dataset.tenor;
    const room = MAX_SERIES - state.compare.length;
    if (state.tenors.includes(t)) {
      state.tenors = state.tenors.filter(x => x !== t);
      delete state.slots[seriesKey(m.curve, t)];
    } else {
      while (state.tenors.length >= Math.max(1, room)) {
        delete state.slots[seriesKey(m.curve, state.tenors.shift())];
      }
      state.tenors.push(t);
      slotFor(seriesKey(m.curve, t));
    }
    state.tenors.sort((a, b2) => m.tenors.indexOf(a) - m.tenors.indexOf(b2));
    renderControls(); loadSeries();
  };

  // Every tenor of every other market, so the gap between, say, USD SOFR and
  // PHP BVAL can be read straight off one chart.
  // Tenors a market is currently publishing, plus any headline tenor it has
  // simply not published yet today. Without the second half, overnight SOFR
  // drops out of this list whenever the NY Fed has the averages out before the
  // overnight rate, which is most mornings, and the card already carries it.
  const comparable = (x) => {
    const live = ((x.active_tenors && x.active_tenors.length) ? x.active_tenors : x.tenors).slice();
    (x.headline_tenors || []).forEach(t => {
      if (!live.includes(t) && x.tenors.includes(t)) live.push(t);
    });
    return live;
  };
  const options = state.meta
    .filter(x => !m || x.curve !== m.curve)
    .flatMap(x => comparable(x).map(t => ({ key: seriesKey(x.curve, t), label: `${x.label} ${t}` })))
    .filter(o => !state.compare.includes(o.key));
  $("comparePick").innerHTML =
    `<option value="">Add a market…</option>` +
    options.map(o => `<option value="${o.key}">${o.label}</option>`).join("");
  $("comparePick").disabled = !options.length;
  $("comparePick").onchange = (e) => {
    const key = e.target.value;
    if (!key) return;
    if (state.compare.length >= MAX_SERIES) state.compare.shift();
    state.compare.push(key);
    renderControls(); loadSeries();
  };

  $("compareChips").innerHTML = state.compare.map(key => {
    const [curve, tenor] = key.split("|");
    const cm = state.meta.find(x => x.curve === curve);
    return `<button class="tchip" data-key="${key}" aria-pressed="true"
              style="color:${colorOf(key)}" title="Remove from the chart">
              <span class="dot"></span>${cm ? cm.label : curve} ${tenor}<span class="x">&times;</span>
            </button>`;
  }).join("");
  $("compareChips").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.compare = state.compare.filter(k => k !== b.dataset.key);
    delete state.slots[b.dataset.key];
    renderControls(); loadSeries();
  };

  $("shapeRange").innerHTML = [["1 month",30],["3 months",90],["1 year",365],["3 years",1095]]
    .map(([l, d]) => `<button data-back="${d}" aria-pressed="${state.shapeBack === d}">vs ${l} ago</button>`).join("");
  $("shapeRange").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.shapeBack = +b.dataset.back;
    renderControls(); loadShape();
  };

  if (m) {
    $("srcNote").innerHTML =
      `<strong>${m.label}</strong> - ${m.description}. Source: ${m.source}
       (<a href="${m.url}" target="_blank" rel="noopener">${new URL(m.url).hostname}</a>).
       Coverage ${m.first_date ? niceDate(m.first_date) : "–"} to
       ${m.last_date ? niceDate(m.last_date) : "–"}.`;
  }
}

const curveMeta = () => state.meta.find(m => m.curve === state.curve);

/* Default to tenors that are still being published - picking a discontinued
   tenor (2M / 12M KLIBOR) would draw an empty line. */
function defaultTenors() {
  const m = curveMeta();
  const t = (m.active_tenors && m.active_tenors.length) ? m.active_tenors : m.tenors;
  // A short curve fits entirely, so show all of it rather than a subset.
  if (t.length <= MAX_SERIES) return t.slice();
  const want = ["3M", "1Y", "5Y", "10Y"].filter(x => t.includes(x));
  return want.length >= 2 ? want : [t[0], t[Math.floor(t.length/2)], t[t.length-1]];
}

/* ---------------- history chart ---------------- */

async function loadSeries() {
  const series = activeSeries();
  if (!series.length) { $("chart").innerHTML = `<p class="empty">Select at least one tenor.</p>`;
    $("legend").innerHTML = ""; renderTable(); return; }

  // The window ends at the newest date any market on the chart has published,
  // so a market that is a day behind is not cropped off the right edge.
  const ends = series
    .map(s2 => (state.meta.find(x => x.curve === s2.curve) || {}).last_date)
    .filter(Boolean);
  const end = ends.length ? ends.reduce((a, b) => (a > b ? a : b)) : iso(new Date());
  let start = "1900-01-01";
  if (state.range) {
    const d = new Date(end + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() - state.range);
    start = iso(d);
  }
  const spec = series.map(s2 => `${s2.curve}:${s2.tenor}`).join(",");
  state.data = await getJSON(
    `/api/series?series=${encodeURIComponent(spec)}&start=${start}&end=${end}`);
  state.series = series;          // what was actually drawn, after the cap
  drawSeries();
  renderTable();
}

function drawSeries() {
  const host = $("chart"), d = state.data;
  if (!d || !d.dates.length) { host.innerHTML = `<p class="empty">No data in this range.</p>`; return; }

  const W = 1000, H = 340, P = { t: 14, r: 62, b: 30, l: 46 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;

  const series = state.series.length ? state.series : activeSeries();
  // Short labels while one market is on the chart; qualified once more than
  // one is, because "3M" no longer says whose 3M it is.
  const mixed = new Set(series.map(s2 => s2.curve)).size > 1;
  const nameOf = (s2) => (mixed ? s2.label : s2.tenor);

  const vals = [];
  series.forEach(s2 => (d.series[s2.key] || []).forEach(v => v !== null && vals.push(v)));
  if (!vals.length) { host.innerHTML = `<p class="empty">No data in this range.</p>`; return; }
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.12 || 0.1;
  lo -= pad; hi += pad;

  const n = d.dates.length;
  const X = (i) => P.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = (v) => P.t + ih - ((v - lo) / (hi - lo)) * ih;

  // y ticks on a round step
  const raw = (hi - lo) / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw) || mag * 10;
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);

  const xIdx = [0, Math.round((n-1)*0.25), Math.round((n-1)*0.5), Math.round((n-1)*0.75), n-1]
    .filter((v, i, a) => a.indexOf(v) === i);

  // Label granularity follows the span, so a 1-month view does not print
  // "Aug 2026" five times in a row.
  const spanDays = (new Date(d.dates[n-1]) - new Date(d.dates[0])) / 86400000;
  const axisLabel = (s) => {
    const parts = niceDate(s).split(" ");                 // [d, Mon, YYYY]
    if (spanDays <= 120)  return `${parts[0]} ${parts[1]}`;
    if (spanDays <= 1460) return `${parts[1]} ${parts[2].slice(2)}`;
    return parts[2];
  };

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Rate history: ${series.map(nameOf).join(", ")}">`;

  ticks.forEach(v => {
    svg += `<line class="gridline" x1="${P.l}" y1="${Y(v).toFixed(1)}" x2="${P.l+iw}" y2="${Y(v).toFixed(1)}"/>`;
    svg += `<text class="tick" x="${P.l-8}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${v.toFixed(2)}</text>`;
  });
  svg += `<line class="axisline" x1="${P.l}" y1="${P.t+ih}" x2="${P.l+iw}" y2="${P.t+ih}"/>`;
  let prevLbl = null;
  xIdx.forEach(i => {
    const lbl = axisLabel(d.dates[i]);
    if (lbl === prevLbl) return;                          // drop repeated labels
    prevLbl = lbl;
    svg += `<text class="tick" x="${X(i).toFixed(1)}" y="${P.t+ih+18}" text-anchor="middle">${lbl}</text>`;
  });

  series.forEach(s2 => {
    const arr = d.series[s2.key] || [];
    let path = "", pen = false, lastI = -1;
    arr.forEach((v, i) => {
      if (v === null) { pen = false; return; }
      path += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1) + " ";
      pen = true; lastI = i;
    });
    if (!path) return;
    svg += `<path class="line" d="${path.trim()}" stroke="${colorOf(s2.key)}"/>`;
    if (lastI >= 0) {
      // The end label stays short even when qualified elsewhere: there is only
      // 62px of right margin and the tenor is what identifies the line there.
      svg += `<text class="endlabel" x="${P.l+iw+8}" y="${(Y(arr[lastI])+4).toFixed(1)}"
               fill="${colorOf(s2.key)}">${s2.tenor} ${fmt(arr[lastI], 2)}</text>`;
    }
  });

  svg += `<g id="cross" style="display:none">
            <line class="axisline" y1="${P.t}" y2="${P.t+ih}" stroke-dasharray="4 4"/></g>`;
  svg += `<rect id="hit" x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  svg += `</svg>`;
  host.innerHTML = svg;

  $("legend").innerHTML = series.map(s2 =>
    `<span><i style="background:${colorOf(s2.key)}"></i>${s2.label}</span>`).join("");

  attachCrosshair(host, d, X, n, P, ih);
}

function attachCrosshair(host, d, X, n, P, ih) {
  const svg = host.querySelector("svg");
  const hit = host.querySelector("#hit");
  const cross = host.querySelector("#cross");
  const line = cross.querySelector("line");
  const tip = $("tip");

  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const scale = 1000 / r.width;
    const x = (ev.clientX - r.left) * scale;
    let i = n === 1 ? 0 : Math.round(((x - P.l) / (X(n-1) - X(0) || 1)) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));

    cross.style.display = "";
    line.setAttribute("x1", X(i).toFixed(1));
    line.setAttribute("x2", X(i).toFixed(1));

    const rows = (state.series.length ? state.series : activeSeries()).map(s2 => {
      const v = (d.series[s2.key] || [])[i];
      return `<div class="r"><i style="display:inline-block;width:10px;height:3px;border-radius:2px;
              background:${colorOf(s2.key)}"></i>${s2.label}<b>${fmt(v)}%</b></div>`;
    }).join("");
    tip.innerHTML = `<div class="d">${niceDate(d.dates[i])}</div>${rows}`;
    tip.classList.add("on");
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let lx = ev.clientX + 14, ly = ev.clientY - th / 2;
    if (lx + tw > innerWidth - 8) lx = ev.clientX - tw - 14;
    tip.style.left = Math.max(8, lx) + "px";
    tip.style.top = Math.max(8, Math.min(innerHeight - th - 8, ly)) + "px";
  };
  const leave = () => { cross.style.display = "none"; tip.classList.remove("on"); };
  hit.addEventListener("mousemove", move);
  hit.addEventListener("mouseleave", leave);
  hit.addEventListener("touchmove", (e) => { move(e.touches[0]); e.preventDefault(); }, {passive:false});
  hit.addEventListener("touchend", leave);
}

function renderTable() {
  const d = state.data, host = $("dataview");
  host.hidden = !state.tableView;
  if (!state.tableView || !d) return;
  const series = state.series.length ? state.series : activeSeries();
  const head = `<tr><th>Date</th>${series.map(s2 => `<th>${s2.label}</th>`).join("")}</tr>`;
  const rows = d.dates.slice().reverse().map((dt, ri) => {
    const i = d.dates.length - 1 - ri;
    return `<tr><td>${dt}</td>${series.map(s2 =>
      `<td>${fmt((d.series[s2.key] || [])[i])}</td>`).join("")}</tr>`;
  }).join("");
  host.innerHTML = `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

/* ---------------- term structure ---------------- */

async function loadShape() {
  const m = curveMeta();
  if (!m || !m.last_date) { $("shape").innerHTML = `<p class="empty">No data yet.</p>`; return; }
  const back = new Date(m.last_date + "T00:00:00Z");
  back.setUTCDate(back.getUTCDate() - state.shapeBack);
  const [now, then] = await Promise.all([
    getJSON(`/api/shape?curve=${m.curve}&date=${m.last_date}`),
    getJSON(`/api/shape?curve=${m.curve}&date=${iso(back)}`),
  ]);
  state.shape = { now, then };
  drawShape();
}

function drawShape() {
  const host = $("shape");
  const { now, then } = state.shape;
  if (!now.points.length) { host.innerHTML = `<p class="empty">No data yet.</p>`; return; }
  if (now.points.length === 1) {
    host.innerHTML = `<p class="empty">${curveMeta().label} publishes a single tenor
      (${now.points[0].tenor}) - there is no term structure to plot.
      Use the history chart above.</p>`;
    $("shapeLegend").innerHTML = ""; return;
  }

  const W = 1000, H = 280, P = { t: 16, r: 52, b: 34, l: 46 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const sets = [["Latest", now, "var(--series-1)"], ["Earlier", then, "var(--series-2)"]]
    .filter(([, s]) => s.points.length > 1);

  const vals = sets.flatMap(([, s]) => s.points.map(p => p.rate));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.15 || 0.1; lo -= pad; hi += pad;

  const labels = now.points.map(p => p.tenor);
  const X = (t) => P.l + (labels.indexOf(t) / (labels.length - 1)) * iw;
  const Y = (v) => P.t + ih - ((v - lo) / (hi - lo)) * ih;

  const raw = (hi - lo) / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw) || mag * 10;

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${curveMeta().label} term structure, latest versus earlier">`;
  for (let v = Math.ceil(lo/step)*step; v <= hi; v += step) {
    svg += `<line class="gridline" x1="${P.l}" y1="${Y(v).toFixed(1)}" x2="${P.l+iw}" y2="${Y(v).toFixed(1)}"/>
            <text class="tick" x="${P.l-8}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${v.toFixed(2)}</text>`;
  }
  svg += `<line class="axisline" x1="${P.l}" y1="${P.t+ih}" x2="${P.l+iw}" y2="${P.t+ih}"/>`;
  labels.forEach(t => {
    svg += `<text class="tick" x="${X(t).toFixed(1)}" y="${P.t+ih+18}" text-anchor="middle">${t}</text>`;
  });

  sets.forEach(([name, s, col]) => {
    const pts = s.points.filter(p => labels.includes(p.tenor));
    if (pts.length < 2) return;
    const path = pts.map((p, i) => (i ? "L" : "M") + X(p.tenor).toFixed(1) + " " + Y(p.rate).toFixed(1)).join(" ");
    svg += `<path class="line" d="${path}" stroke="${col}"/>`;
    pts.forEach(p => {
      svg += `<circle cx="${X(p.tenor).toFixed(1)}" cy="${Y(p.rate).toFixed(1)}" r="4"
               fill="${col}" stroke="var(--surface-1)" stroke-width="2"><title>${name} ·
               ${p.tenor} · ${fmt(p.rate)}%</title></circle>`;
    });
    const last = pts[pts.length - 1];
    svg += `<text class="endlabel" x="${P.l+iw+8}" y="${(Y(last.rate)+4).toFixed(1)}"
             fill="${col}">${fmt(last.rate, 2)}</text>`;
  });
  // Same dashed guide as the history chart. The per-point <title> above only
  // ever gives one series on a slow hover; this gives both dates at the tenor
  // under the cursor, which is what makes the move between them readable.
  svg += `<g id="shapeCross" style="display:none">
            <line class="axisline" y1="${P.t}" y2="${P.t+ih}" stroke-dasharray="4 4"/></g>`;
  svg += `<rect id="shapeHit" x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  svg += `</svg>`;
  host.innerHTML = svg;

  $("shapeLegend").innerHTML = sets.map(([name, s, col]) =>
    `<span><i style="background:${col}"></i>${name} - ${niceDate(s.date)}</span>`).join("");

  attachShapeGuide(host, sets, labels, X, P, ih);
}

function attachShapeGuide(host, sets, labels, X, P, ih) {
  const svg = host.querySelector("svg");
  const hit = host.querySelector("#shapeHit");
  const cross = host.querySelector("#shapeCross");
  if (!hit || !cross) return;
  const line = cross.querySelector("line");
  const tip = $("tip");

  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (1000 / r.width);
    // Nearest tenor rather than the one to the left, so the guide snaps to
    // whichever label the cursor is actually closest to.
    let best = 0, bestD = Infinity;
    labels.forEach((t, i) => {
      const d = Math.abs(X(t) - x);
      if (d < bestD) { bestD = d; best = i; }
    });
    const tenor = labels[best];

    cross.style.display = "";
    line.setAttribute("x1", X(tenor).toFixed(1));
    line.setAttribute("x2", X(tenor).toFixed(1));

    const rows = sets.map(([name, sset, col]) => {
      const p = sset.points.find(q => q.tenor === tenor);
      return `<div class="r"><i style="display:inline-block;width:10px;height:3px;border-radius:2px;
              background:${col}"></i>${name}<b>${p ? fmt(p.rate) + "%" : "–"}</b></div>`;
    }).join("");

    // The move between the two dates: the number the chart exists to show,
    // which was previously left to be eyeballed off the gap between the lines.
    // Latest minus earlier, so a rate that rose reads positive. Percentage
    // points, because the difference between two percentages is not itself a
    // percentage; basis points follow, as used on the rate cards.
    let delta = "";
    if (sets.length === 2) {
      const a = sets[0][1].points.find(q => q.tenor === tenor);
      const b = sets[1][1].points.find(q => q.tenor === tenor);
      if (a && b) {
        const d = a.rate - b.rate;
        const cls = d > 0 ? "chg-rise" : d < 0 ? "chg-fall" : "chg-flat";
        const sign = d > 0 ? "+" : "";
        delta = `<div class="r" style="margin-top:5px;padding-top:5px;
                   border-top:1px solid var(--grid)">Change
                 <b class="${cls}">${sign}${d.toFixed(3)} pp
                   (${sign}${(d * 100).toFixed(1)} bp)</b></div>`;
      }
    }
    tip.innerHTML = `<div class="d">${tenor}</div>${rows}${delta}`;
    tip.classList.add("on");
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let lx = ev.clientX + 14, ly = ev.clientY - th / 2;
    if (lx + tw > innerWidth - 8) lx = ev.clientX - tw - 14;
    tip.style.left = Math.max(8, lx) + "px";
    tip.style.top = Math.max(8, Math.min(innerHeight - th - 8, ly)) + "px";
  };
  const leave = () => { cross.style.display = "none"; tip.classList.remove("on"); };
  hit.addEventListener("mousemove", move);
  hit.addEventListener("mouseleave", leave);
  hit.addEventListener("touchmove", (e) => { move(e.touches[0]); e.preventDefault(); }, {passive:false});
  hit.addEventListener("touchend", leave);
}

/* ---------------- wiring ---------------- */

$("theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("ratesTheme", next);
};
if (localStorage.getItem("ratesTheme")) {
  document.documentElement.setAttribute("data-theme", localStorage.getItem("ratesTheme"));
}

$("tableToggle").onclick = (e) => {
  state.tableView = !state.tableView;
  e.target.setAttribute("aria-pressed", String(state.tableView));
  renderTable();
};

$("exportBtn").onclick = () => {
  const m = curveMeta(); if (!m) return;
  const end = m.last_date;
  let start = "1900-01-01";
  if (state.range) {
    const d = new Date(end + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() - state.range);
    start = iso(d);
  }
  location.href = `/api/export?curve=${m.curve}&start=${start}&end=${end}`;
};

$("refresh").onclick = async () => {
  const b = $("refresh");
  b.disabled = true; b.textContent = "Refreshing…";
  await fetch("/api/refresh", { method: "POST" });
  const poll = setInterval(async () => {
    const m = await getJSON("/api/meta");
    if (!m.refresh.running) {
      clearInterval(poll);
      b.disabled = false; b.textContent = "Refresh now";
      await boot(true);
    }
  }, 2000);
};

async function boot(keepSelection) {
  const m = await getJSON("/api/meta");
  state.meta = m.curves;
  state.markets = m.markets;
  const withData = state.meta.filter(c => c.rows > 0);
  const broken = withData.filter(c => c.stale || c.failing);
  $("subtitle").innerHTML =
    `Local database of PHP, MYR and USD benchmark rates &middot; ${
      state.meta.reduce((a, c) => a + c.rows, 0).toLocaleString()} observations` +
    (broken.length ? ` &middot; <strong style="color:var(--down)">${broken.map(c => c.label).join(", ")
      } not updating</strong>` : ` &middot; all sources current`);
  renderAlerts();

  if (!keepSelection || !state.curve) {
    state.curve = (withData[0] || state.meta[0]).curve;
    state.slots = {};
    state.tenors = defaultTenors();
  }
  renderCards();
  renderControls();
  await Promise.all([loadSeries(), loadShape()]);

  $("footer").innerHTML =
    `Rates are stored exactly as published by each source and are not adjusted or interpolated.
     Figures are for internal reference; confirm against the primary source before use in
     documentation or pricing. Database refreshed by the scheduled daily job -
     the age badge on each card shows how current it is.`;
}

boot().catch(err => {
  $("subtitle").innerHTML =
    `<strong style="color:var(--down)">Could not load data:</strong> ${err.message}`;
});
</script>
