name: Daily rates update

# Replaces the Windows scheduled task once the app is hosted: this runs on
# GitHub's servers, so no laptop needs to be switched on.
on:
  schedule:
    # 12:00 noon Asia/Kuala_Lumpur and Asia/Manila. Both are UTC+8 year round
    # with no daylight saving, so 04:00 UTC is noon in both, always. GitHub cron
    # is UTC only and has no timezone setting, so this offset is fixed.
    # Every day, including weekends: nothing publishes then, so those runs find
    # no new data and commit nothing. Harmless, and it keeps the repository
    # active, which stops GitHub disabling the schedule for inactivity.
    # GitHub often runs scheduled jobs 10-30 minutes late under load, which does
    # not matter here because each run re-checks the previous 45 days.
    - cron: "0 4 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

concurrency:
  group: rates-update       # never let two runs write the database at once
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the refreshed database

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the database from the committed CSVs
        # rates.db is not in the repository; data/*.csv is. Rebuilding first
        # gives the anomaly guard the history it needs to judge incoming data.
        run: python cli.py rebuild

      - name: Fetch the latest rates
        id: fetch
        # continue-on-error matters: cli.py exits non-zero if ANY source fails,
        # and without this the job would stop here, so a single network blip on
        # one source would discard the other six curves' data for that day. The
        # run is still marked failed by the gate step at the end.
        continue-on-error: true
        env:
          PDEX_API_KEY: ${{ secrets.PDEX_API_KEY }}
        run: python cli.py update

      - name: Write the CSVs back out
        run: python cli.py export

      - name: Run the contract tests
        # If a source changed shape in a way that would alter the CSV format,
        # fail here rather than committing it.
        run: python tests/test_contract.py

      - name: Commit if anything changed
        run: |
          git config user.name  "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          # Re-point at whatever is on the remote now, keeping the CSVs this run
          # just wrote. A re-run checks out the commit the run was triggered
          # from, which by then is usually behind, and the first attempt may
          # already have pushed some of today's rows.
          #
          # This replaced "git pull --rebase". Rebasing cannot work here: both
          # the remote commit and this one insert a line at the top of the same
          # CSVs, so it conflicts on every file and the step dies half way
          # through a rebase. Reproduced, and it is what made the re-run of
          # 2026-10-06 fail with a second, unrelated-looking error.
          #
          # There is nothing to merge in any case. export rewrites each CSV in
          # full from the database, and the database was rebuilt from the
          # committed CSVs at the start of this job, so what sits in the working
          # tree already contains everything the remote has plus whatever today
          # added.
          #
          # A mixed reset, not --soft: it moves the index to the remote tree as
          # well, so only data/ is staged below. With --soft the index would
          # keep this checkout's stale copies of every other file, and the
          # commit would quietly revert any code pushed since the run started.
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          git reset --quiet "origin/${GITHUB_REF_NAME}"

          git add data
          if git diff --staged --quiet; then
            echo "No new rates today (weekend, public holiday, or already current)."
          else
            git commit -m "Rates update $(date -u +%Y-%m-%d)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Report source health
        if: always()
        run: python cli.py status

      - name: Fail the run if a source failed
        # Whatever succeeded has been committed by now. This turns the run red
        # so the failure is visible and notifies you, rather than passing quietly.
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::One or more sources failed. Data from the healthy sources"
          echo "::error::was still saved. Run 'python cli.py doctor' locally to diagnose."
          exit 1
