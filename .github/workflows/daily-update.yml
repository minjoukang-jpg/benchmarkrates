name: Daily rates update

# Replaces the Windows scheduled task once the app is hosted: this runs on
# GitHub's servers, so no laptop needs to be switched on.
on:
  schedule:
    # 09:30 Asia/Manila and Asia/Kuala_Lumpur (both UTC+8), weekdays.
    # Late enough that BVAL and KLIBOR have published for the day.
    - cron: "30 1 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

concurrency:
  group: rates-update       # never let two runs write the database at once
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the refreshed database

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the database from the committed CSVs
        # rates.db is not in the repository; data/*.csv is. Rebuilding first
        # gives the anomaly guard the history it needs to judge incoming data.
        run: python cli.py rebuild

      - name: Fetch the latest rates
        id: fetch
        # continue-on-error matters: cli.py exits non-zero if ANY source fails,
        # and without this the job would stop here, so a single network blip on
        # one source would discard the other six curves' data for that day. The
        # run is still marked failed by the gate step at the end.
        continue-on-error: true
        env:
          PDEX_API_KEY: ${{ secrets.PDEX_API_KEY }}
        run: python cli.py update

      - name: Write the CSVs back out
        run: python cli.py export

      - name: Run the contract tests
        # If a source changed shape in a way that would alter the CSV format,
        # fail here rather than committing it.
        run: python tests/test_contract.py

      - name: Commit if anything changed
        run: |
          git config user.name  "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No new rates today (weekend, public holiday, or already current)."
          else
            git commit -m "Rates update $(date -u +%Y-%m-%d)"
            # Another run or a manual edit may have landed first; rebase onto it
            # rather than failing outright.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Report source health
        if: always()
        run: python cli.py status

      - name: Fail the run if a source failed
        # Whatever succeeded has been committed by now. This turns the run red
        # so the failure is visible and notifies you, rather than passing quietly.
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::One or more sources failed. Data from the healthy sources"
          echo "::error::was still saved. Run 'python cli.py doctor' locally to diagnose."
          exit 1
